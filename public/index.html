<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Bot</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
    main { max-width: 680px; padding: 48px 28px; text-align: center; }
    h1 { margin-bottom: 12px; font-size: 42px; }
    p { color: #94a3b8; line-height: 1.6; }
    code { padding: 4px 8px; border-radius: 6px; background: #1e293b; color: #c4b5fd; }
    .status { display: inline-block; margin-top: 18px; padding: 8px 14px; border: 1px solid #334155; border-radius: 999px; color: #86efac; }
  </style>
</head>
<body>
  <main>
    <h1>PDF Bot</h1>
    <p>The Telegram PDF classification service is deployed and ready for webhook configuration.</p>
    <p>Webhook endpoint: <code>/api/webhook</code></p>
    <div class="status">Service online</div>
  </main>
</body>
</html>
